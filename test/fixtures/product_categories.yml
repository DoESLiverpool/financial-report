# Categories used by ProductVolumesCalculatorTest.
#
# Regexes are kept mutually exclusive, or shadowed by an exact description
# below, because CategoriesCalculator tries regexes in category id order and
# fixture ids are not predictable.

monthly_desk:
  name: Monthly Desk
  regex: .*Permanent Desk.*
  unit_price: 215.00

mailbox:
  name: Mailbox
  regex: .*Mailbox.*
  unit_price: 15.00

friend:
  name: Friend
  regex: .*(membership|friend).*
  unit_price: 10.00

key_deposit:
  name: Key Deposit
  regex: .*Key Deposit.*
  unit_price: 50.00

# No unit price: reported as money only, never itemised into units.
event_hire:
  name: Event Hire
  regex: .*(Room|venue) (hire|rental).*

fiscal_host:
  name: Fiscal Host Funds
